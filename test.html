<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenStreetMap Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #mapContainer { width: 100%; height: 400px; border: 2px solid #ccc; margin: 20px 0; }
        .controls { margin: 10px 0; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
        .info { background: #f0f0f0; padding: 10px; margin: 10px 0; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>🗺️ OpenStreetMap Test</h1>
    
    <div class="controls">
        <button onclick="testDrawParcel()">📐 Parsel Çiz (1000m²)</button>
        <button onclick="testAddBuildings()">🏢 Bina Ekle</button>
        <button onclick="testSearchAddress()">🔍 Adres Ara (Taksim)</button>
        <button onclick="testCurrentLocation()">📍 Mevcut Konum</button>
        <button onclick="testClearMap()">🗑️ Temizle</button>
    </div>
    
    <div id="mapContainer"></div>
    
    <div class="info">
        <h3>Test Sonuçları:</h3>
        <div id="testResults">Henüz test yapılmadı...</div>
    </div>

    <script type="module">
        import { LeafletMapIntegration } from './src/modules/leaflet-map.js';
        
        let mapIntegration;
        const testResults = document.getElementById('testResults');
        
        // Test fonksiyonları global scope'a ekle
        window.testDrawParcel = testDrawParcel;
        window.testAddBuildings = testAddBuildings;
        window.testSearchAddress = testSearchAddress;
        window.testCurrentLocation = testCurrentLocation;
        window.testClearMap = testClearMap;
        
        // Harita başlat
        async function initMap() {
            try {
                mapIntegration = new LeafletMapIntegration();
                await mapIntegration.initializeMap('mapContainer', {
                    center: [41.0082, 28.9784],
                    zoom: 13
                });
                addResult('✅ OpenStreetMap başarıyla yüklendi!');
            } catch (error) {
                addResult('❌ Harita yükleme hatası: ' + error.message);
            }
        }
        
        function addResult(message) {
            const time = new Date().toLocaleTimeString();
            testResults.innerHTML += `<div>[${time}] ${message}</div>`;
        }
        
        async function testDrawParcel() {
            try {
                const center = [41.0082, 28.9784];
                const area = 1000; // 1000 m²
                await mapIntegration.drawParcelBoundaries(center, area, 'rectangle');
                addResult('✅ Parsel çizimi başarılı (1000m²)');
            } catch (error) {
                addResult('❌ Parsel çizimi hatası: ' + error.message);
            }
        }
        
        async function testAddBuildings() {
            try {
                const blocks = [
                    { id: 1, floors: 4, apartments: {'2+1': 2, '3+1': 1} },
                    { id: 2, floors: 5, apartments: {'1+1': 3, '2+1': 2} }
                ];
                const center = [41.0082, 28.9784];
                await mapIntegration.showBuildingsOnMap(blocks, center);
                addResult('✅ Binalar haritaya eklendi (2 blok)');
            } catch (error) {
                addResult('❌ Bina ekleme hatası: ' + error.message);
            }
        }
        
        async function testSearchAddress() {
            try {
                const result = await mapIntegration.searchAddress('Taksim, İstanbul');
                addResult(`✅ Adres bulundu: ${result.formattedAddress}`);
            } catch (error) {
                addResult('❌ Adres arama hatası: ' + error.message);
            }
        }
        
        async function testCurrentLocation() {
            try {
                const location = await mapIntegration.getCurrentLocation();
                addResult(`✅ Mevcut konum: ${location.lat.toFixed(6)}, ${location.lng.toFixed(6)}`);
            } catch (error) {
                addResult('❌ Konum alma hatası: ' + error.message);
            }
        }
        
        async function testClearMap() {
            try {
                await mapIntegration.clearMap();
                addResult('✅ Harita temizlendi');
            } catch (error) {
                addResult('❌ Harita temizleme hatası: ' + error.message);
            }
        }
        
        // Sayfa yüklendiğinde haritayı başlat
        initMap();
    </script>
</body>
</html>
